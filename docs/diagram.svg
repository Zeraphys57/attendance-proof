<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 940" width="820" height="940" font-family="DejaVu Sans, Arial, sans-serif"><rect width="820" height="1010" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a929c"/></marker><marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdf"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hadir hanya sah jika HP ada di kelas dan disaksikan 2 HP hasil undian</text><line x1="110" x2="110" y1="88" y2="926" stroke="#8a929c" stroke-dasharray="4 4"/><line x1="310" x2="310" y1="88" y2="926" stroke="#8a929c" stroke-dasharray="4 4"/><line x1="510" x2="510" y1="88" y2="926" stroke="#8a929c" stroke-dasharray="4 4"/><line x1="710" x2="710" y1="88" y2="926" stroke="#8a929c" stroke-dasharray="4 4"/><rect x="30" y="48" width="160" height="40" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="110" y="73" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">HP Mahasiswa (chip)</text><rect x="230" y="48" width="160" height="40" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="310" y="73" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2 HP Saksi (chip)</text><rect x="430" y="48" width="160" height="40" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="510" y="73" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Laptop Dosen</text><rect x="630" y="48" width="160" height="40" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="710" y="73" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Server Presensi</text><line x1="24" x2="796" y1="118" y2="118" stroke="#d9dde2"/><text x="796" y="112" font-size="11.5" font-weight="600" fill="#5b6470" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 · Registrasi saat KRS (sekali)</text><path d="M110 160H710" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="410.0" y="138" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">R1 pk chip + attestation vendor</text><text x="410.0" y="153" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kunci lahir di chip, tidak bisa diekspor</text><path d="M710 210H110" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="410.0" y="188" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">R2 Sertifikat = Sig(CA kampus, NPM | pk)</text><text x="410.0" y="203" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">CA kampus di-pin di aplikasi</text><line x1="24" x2="796" y1="242" y2="242" stroke="#d9dde2"/><text x="796" y="236" font-size="11.5" font-weight="600" fill="#5b6470" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 · Ronde presensi (tiap 30 detik)</text><path d="M510 288H110" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M510 288H710" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="410" y="266" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">B Beacon BLE {sid, ronde, t, nonce, seed} + Sig dosen</text><text x="410" y="281" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">disiarkan ke semua HP di ruangan dan dicatat server</text><rect x="10.0" y="304" width="212" height="94" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="116" y="324" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">HP memproses lokal</text><text x="22.0" y="342" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1. Cek sertifikat + Sig dosen</text><text x="22.0" y="358" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2. Tolak jika beacon &gt; 3 detik</text><text x="22.0" y="374" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3. Undi 4 kandidat saksi:</text><text x="22.0" y="390" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">    H(seed | NPM | j)</text><path d="M110 442H310" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="210.0" y="420" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">W1 Minta kesaksian</text><text x="210.0" y="435" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">{NPM, nonce} lewat BLE</text><rect x="199.0" y="458" width="222" height="94" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="310" y="478" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Chip saksi otomatis</text><text x="211.0" y="496" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1. Nonce sama dengan beacon?</text><text x="211.0" y="512" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2. Masih dalam 3 detik?</text><text x="211.0" y="528" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3. Tanda tangan, tanpa</text><text x="211.0" y="544" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">    keputusan manusia</text><path d="M310 596H110" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="210.0" y="574" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">W2 2 kesaksian bertanda tangan</text><text x="210.0" y="589" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Sig saksi(sid, nonce, NPM, saksi, t)</text><path d="M110 656H710" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="410.0" y="634" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">C Klaim {sid, ronde, nonce, NPM, t, 2 kesaksian} + Sig chip</text><text x="410.0" y="649" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">dikirim lewat internet, sertifikat ikut dilampirkan</text><rect x="612.0" y="676" width="196" height="94" rx="8" fill="#ffffff" stroke="#8a929c" stroke-width="1.2"/><text x="710" y="696" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Server memverifikasi</text><text x="624.0" y="714" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1. Sertifikat dan Sig klaim</text><text x="624.0" y="730" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2. Nonce = ronde aktif</text><text x="624.0" y="746" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3. Saksi termasuk 4 kandidat</text><text x="624.0" y="762" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4. Minimal 2 saksi sah</text><line x1="24" x2="796" y1="800" y2="800" stroke="#d9dde2"/><text x="796" y="794" font-size="11.5" font-weight="600" fill="#5b6470" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2 · Audit acak (akhir kelas)</text><path d="M710 846H510" stroke="#8a929c" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><text x="610.0" y="824" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A Daftar hadir + 3 nama audit</text><text x="610.0" y="839" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">diundi dari seed dosen</text><path d="M110 910H510" stroke="#2f6fdf" stroke-width="2" fill="none" marker-end="url(#acc)" marker-start="url(#acc)" stroke-dasharray="6 4"/><text x="310.0" y="888" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nama dipanggil, mahasiswa konfirmasi tatap muka</text><text x="310.0" y="903" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">menutup celah satu orang membawa dua HP</text></svg>